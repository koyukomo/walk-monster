/* 修行バトルのドット絵背景: 横128ドットで描いて拡大。床(.flr)は高さの基準として残し、見た目は絵に任せる */

.arena.px .flr{background:none;border-top-color:transparent}

.arena.px .hpb{box-shadow:0 0 0 1.5px #0b1736}
/* バトル: 敵は右上(ゲージは左)、味方は左下(ゲージは右)。余白は上にまとめる */
/* 375×667 と同じ大きさ・間隔で、床を基準に置く。画面が大きい分は上の空が伸びるだけ(横は中央にそろえる) */
.unit{position:relative;z-index:2;display:flex;align-items:center;gap:8px;padding:0 10px;flex:none;width:100%;max-width:335px;align-self:center;box-sizing:border-box}
.unit.e{margin-top:auto}
.unit.e{justify-content:flex-end}
.unit .gg{flex:1;min-width:104px;max-width:150px}
.unit .sg{letter-spacing:1px}
/* ゲージは 敵=頭の高さ・味方=足元の高さ。2体を少し重ねて間を詰める(ゲージの無い角どうしが重なる) */
/* 敵は奥にいるので少し小さく。ゲージは左上の音ボタンをよける */
.unit.e{padding-left:36px}
.unit.e .spr{width:min(var(--s),100cqw - 160px,175px)}
.unit.e .gg{align-self:flex-start}
.unit.p .gg{align-self:flex-end}
.unit.p{margin-top:calc(-.1*var(--s))}
#psp .pm{transform:scaleX(-1)}
.unit .spr{width:46%;width:var(--s);flex:none;aspect-ratio:1}
.unit .spr svg{width:100%;height:100%}
.unit .spr *{stroke:#0b1736}
.unit .nm,.odnm{font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:0 6px}
.unit .nm{flex-wrap:wrap}
.hpb{height:12px;border:2px solid #cfe3ff;border-radius:7px;background:#08102a;overflow:hidden;margin:2px 0}
.hpb i{display:block;height:100%;background:linear-gradient(#7dff9a,#1fa845);transition:width .35s}
.hpb.m i{background:linear-gradient(#8fe0ff,#2457e6)}
.hpb.e i{background:linear-gradient(#ff9a9a,#e8262c)}
.dn{position:absolute;z-index:6;font-family:"Dela Gothic One",sans-serif;font-size:30px;color:#fff;-webkit-text-stroke:5px #7a0010;paint-order:stroke fill;animation:plup .8s forwards;pointer-events:none}
.dn.h{-webkit-text-stroke-color:#0a5a1a}
.dn.hl{color:#9dffb0;-webkit-text-stroke-color:#0a5a1a}
.blog{min-height:46px;margin:6px 0;padding:6px 10px;background:#08102a;border:2px solid #6fb0ff;border-radius:10px;font-size:13px;line-height:1.4}
.cmd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmd button{height:60px;border-radius:14px;border:3px solid #0a2a7a;background:linear-gradient(#7cc4ff,#1f5de0);color:#fff;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:17px;box-shadow:0 4px 0 #0a2a7a;padding:0;line-height:1.2}
.cmd button small{display:block;color:#dbe9ff;font-size:11px}
.cmd button:active:not(:disabled){transform:translateY(3px)}
.cmd button:disabled{filter:grayscale(.8);opacity:.5}
.unit.p.lunge{animation:plunge .35s}
.unit.e.lunge{animation:elunge .35s}
.unit.hit{animation:t-sh .3s}
/* 魔王戦(ダンジョン5層のボス): 味方は映さず、魔王を真ん中に大きく。魔王のゲージはすぐ上、味方のゲージは枠の一番下に横長 */
.arena.mao{padding-bottom:72px}
.arena.mao .unit.e{flex-direction:column;align-items:center;justify-content:flex-end;gap:0;padding:0;max-width:none}
.arena.mao .unit.e .gg{flex:none;width:min(220px,64cqw);max-width:none;align-self:center;position:relative;z-index:1}
.arena.mao .unit.e .spr{width:min(80cqw,65cqh,100cqh - 120px);transform-origin:50% 100%}
.arena.mao .unit.p{position:absolute;left:8px;right:8px;bottom:8px;width:auto;max-width:none;margin:0;padding:3px 10px 4px;background:rgba(8,16,42,.82);border:2px solid #6fb0ff;border-radius:10px;z-index:3}
.arena.mao .unit.p .spr{display:none}
.arena.mao .unit.p .gg{max-width:none;display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.arena.mao .unit.p .gg>:not(.hpb){grid-column:1/-1}
.unit.dead{animation:dead .6s forwards}

/* 技の一覧はメッセージ欄〜4つのボタンの場所に重ねる(ボタンは見えなくするだけで場所は残す=バトルの枠が動かない)。技のボタンはコマンドと同じ大きさ。技が多いときは中でスクロール */
.skm:not([hidden]){position:absolute;left:0;right:0;z-index:7;padding:5px;border-radius:14px;background:#0d1738;border:2px solid #6fb0ff;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}

.skm .big{flex:none;height:30px;padding:0 10px;font-size:12px;font-weight:700;text-align:left}

.skm.more::after{content:'▼';position:absolute;right:8px;bottom:0;font-size:10px;line-height:1;color:#ffb25c;pointer-events:none;animation:skmore 1s infinite alternate}

.sk2{border-radius:12px;border:2px solid #6fb0ff;background:linear-gradient(#17295f,#0d1738);color:#fff;padding:6px 10px;text-align:left}

.dpxc{z-index:1500}
.dex{position:absolute;left:50%;top:12%;z-index:2100;width:54px;height:58px;margin-left:-27px;display:grid;place-items:center;background:#fff;color:#e8262c;font:400 40px/1 "Dela Gothic One",sans-serif;border:4px solid #111;box-shadow:4px 4px 0 #111;pointer-events:none}

.esp .eim.au3,#esp .pm.px.au3,.dob .eim.au3{filter:drop-shadow(0 0 2px #fff6b0) drop-shadow(0 0 7px #ffd23a) drop-shadow(0 0 16px #ffae00)!important}

.pm{background-repeat:no-repeat;background-position:0 0;max-width:100%}
.pet{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scaleY(1.025)}}
.petw.roam{animation:roam 16s linear infinite}
.petw.roam .pm{animation:flip 16s step-end infinite}
@keyframes roam{0%{transform:translateX(var(--rx,16%))}38%{transform:translateX(calc(-1*var(--rx,16%)))}50%{transform:translateX(calc(-1*var(--rx,16%)))}88%{transform:translateX(var(--rx,16%))}100%{transform:translateX(var(--rx,16%))}}
.dpet .pm{transform:scaleX(-1)}
.pm.px{filter:none!important;image-rendering:pixelated;max-width:none;flex:none}
.care{position:absolute;right:8px;top:86px;display:grid;gap:8px;z-index:3}
.care button{position:relative;width:54px;height:54px;border-radius:50%;border:3px solid var(--gold,#ffd36b);background:rgba(8,16,42,.8);color:#fff;font-size:24px;line-height:1;padding:0;display:grid;place-items:center;align-content:center}
.care small{font-size:8px;color:#ff7a9a;letter-spacing:-1px}
.care.off button{opacity:.45}
.care button:active{transform:scale(.92)}
.poo{position:absolute;bottom:calc(var(--abot) + 4px);font-size:30px;z-index:2;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.petw.eat,.petw.eat .pm{animation:none!important;transform:none!important}
.meat{position:absolute;width:80px;z-index:4;animation:mdrop .45s cubic-bezier(.3,1.4,.5,1);filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.meat svg{width:100%;height:auto;display:block}
.meat.gone{animation:mgone .6s forwards}
.petw.chomp .pet{animation:chomp .32s}
.petw.yum .pet{animation:yum .45s 3}
.crumb{position:absolute;width:6px;height:6px;background:#c4542a;border:1px solid #7a2e12;z-index:5;animation:crumb .7s ease-out forwards;pointer-events:none}
.heart{position:absolute;font-style:normal;font-size:22px;color:#ff4d7a;z-index:5;animation:hfly 1.4s ease-out forwards;pointer-events:none}
.yumb{position:absolute;left:50%;transform:translateX(-50%);z-index:6;white-space:nowrap;background:#fff;color:#c4542a;border:3px solid #0b1736;border-radius:16px;padding:4px 14px;font-family:"Dela Gothic One",sans-serif;font-size:18px;animation:bpop .4s cubic-bezier(.3,1.6,.5,1)}
.yumb::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top-color:#0b1736;border-bottom:0}
@keyframes mdrop{from{transform:translateY(-90px);opacity:0}}
@keyframes mgone{to{transform:translateY(10px);opacity:0}}
@keyframes chomp{40%{transform:translateX(-14px) scale(1.05,.95)}}
@keyframes yum{50%{transform:translateY(-18px) scale(.97,1.04)}}
@keyframes crumb{to{transform:translate(var(--dx),-26px) rotate(90deg);opacity:0}}
@keyframes hfly{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:1;transform:translate(calc(var(--dx)*.3),-10px) scale(1)}100%{transform:translate(var(--dx),-70px);opacity:0}}
@keyframes bpop{from{transform:translateX(-50%) scale(.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.meat,.crumb,.heart,.yumb,.petw.chomp .pet,.petw.yum .pet{animation-duration:.01s!important}}
.wave{position:absolute;left:100%;bottom:calc(var(--abot) - 24px);width:150%;height:96px;z-index:5;pointer-events:none;animation:wsweep 1.8s linear forwards}
.wave svg{width:100%;height:100%;display:block;-webkit-mask-image:linear-gradient(to left,transparent,#000 22%);mask-image:linear-gradient(to left,transparent,#000 22%)}
.poo.flush{z-index:6;animation:flush .9s ease-in forwards}
.spark{position:absolute;font-style:normal;font-size:22px;z-index:6;animation:hfly 1.2s ease-out forwards;pointer-events:none}
@keyframes wsweep{to{transform:translateX(-166.7%)}}
@keyframes flush{0%{transform:translate(0,0) rotate(0)}30%{transform:translate(-40px,-22px) rotate(-120deg)}60%{transform:translate(-120px,-8px) rotate(-300deg)}100%{transform:translate(-360px,-16px) rotate(-560deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.wave,.poo.flush,.spark{animation-duration:.01s!important}}
.lfp{height:220px;display:flex;justify-content:center;margin:12px 0 4px;animation:lfup 3s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(255,230,150,.9))}
.lfp .ps{height:100%}
.lfp .pm{animation:none!important}
.lft{text-align:center;font-size:15px;line-height:1.7;color:#fff!important}
.lfs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 14px}
.lfs span{display:grid;text-align:center;font-size:11px;color:#cfe0ff;background:rgba(255,255,255,.08);border-radius:10px;padding:6px 2px}
.lfs b{font-size:15px;color:#ffd36b}
.lfb{text-align:center!important;font-size:16px!important}
@keyframes lfup{50%{transform:translateY(-10px)}}
.cine{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 58%,#2a2350,#05040f 72%);animation:fadein .8s}
.cine.out{animation:fadeout .5s forwards}
.cine canvas{position:absolute;inset:0;width:100%;height:100%}
.cmsg{position:absolute;left:0;right:0;bottom:22%;text-align:center;color:#fff!important;font-size:17px;letter-spacing:2px;opacity:0;text-shadow:0 0 10px rgba(255,220,150,.8)}
.cmsg.on{animation:cmsg 2.6s forwards}
.cskip{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:center;color:rgba(255,255,255,.45)!important;font-size:11px}
@keyframes cmsg{0%{opacity:0;transform:translateY(8px)}20%,80%{opacity:1;transform:none}100%{opacity:.9}}
.cine.evo{background:radial-gradient(ellipse at 50% 55%,#1d2c66,#04061a 72%)}
.cine.evo.glow{background:radial-gradient(ellipse at 50% 55%,#4a3a8a,#060418 72%)}
.rays{position:absolute;left:50%;top:48%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;background:repeating-conic-gradient(rgba(255,230,160,.16) 0 8deg,transparent 8deg 22deg);opacity:0;transition:opacity 1s;animation:spin 18s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 10%,transparent 55%);mask-image:radial-gradient(circle,#000 10%,transparent 55%)}
.glow .rays{opacity:1}
.done .rays{opacity:1;background:repeating-conic-gradient(rgba(255,240,180,.3) 0 8deg,transparent 8deg 22deg);animation-duration:9s}
.ev{position:absolute;left:0;right:0;bottom:36%}
.ev img{position:absolute;bottom:0;left:50%;transform:translateX(-50%);filter:var(--f,none);transition:filter .9s}
.ev img.px{image-rendering:pixelated}
.ev img.e2{transition:none}
.ev img.sil{filter:brightness(0) invert(1) drop-shadow(0 0 10px #fff) drop-shadow(0 0 26px #ffd36b)}
.ev img.hid{visibility:hidden}
.ev img.pop{transition:none;animation:epop .7s cubic-bezier(.3,1.5,.5,1)}
.eflash{position:absolute;inset:0;background:#fff;pointer-events:none;animation:eflash .9s forwards}
.spk2{position:absolute;width:10px;height:10px;margin:-5px;background:#fff6c8;box-shadow:0 0 10px #ffd36b;transform:rotate(45deg);animation:spk2 1.2s ease-out forwards;pointer-events:none}
.evo .cmsg{bottom:20%;font-size:19px;line-height:1.5}
@keyframes epop{0%{transform:translateX(-50%) scale(.6);filter:brightness(3)}60%{transform:translateX(-50%) scale(1.08)}100%{transform:translateX(-50%) scale(1)}}
@keyframes eflash{0%{opacity:1}100%{opacity:0}}
@keyframes spk2{0%{transform:translate(0,0) rotate(45deg) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(225deg) scale(1);opacity:0}}
.egl{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:auto;flex:1;min-height:0;align-content:start;margin:10px 0}
.egc{position:relative;display:grid;justify-items:center;gap:1px;padding:10px 6px 8px;border-radius:16px;color:#fff;text-align:center;border:2px solid transparent;background:linear-gradient(#17295f,#0d1738) padding-box,linear-gradient(135deg,var(--c),#2457e6 80%) border-box;animation:tin .32s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i)*50ms)}
.egc:last-child{grid-column:1/3;width:calc(50% - 4px);justify-self:center}
.egi{height:76px;display:flex;align-items:flex-end;justify-content:center}
.egi img{height:68px;image-rendering:pixelated;filter:drop-shadow(0 0 8px var(--c));animation:egw 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*-.3s);transform-origin:50% 100%}
.egc b{font-size:13px;margin-top:2px}
.egc em{font-style:normal;font-size:11px;font-weight:700;color:#10213f;background:var(--c);border-radius:999px;padding:0 10px}
.egc small{font-size:10px;color:#cfe0ff;line-height:1.35}
.egc.on{box-shadow:0 0 0 3px #fff,0 0 22px var(--c);transform:scale(1.03)}
.egc.on .egi img{animation:egj .5s ease-in-out infinite}
/* 心を引き継ぐ画面・ステータスの心 */
.hsl{display:grid;gap:10px;margin:10px 0;overflow:auto;min-height:0;align-content:start}
.hsc{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;color:#fff;text-align:left;border:2px solid transparent;background:linear-gradient(#2a1d4e,#120c26) padding-box,linear-gradient(135deg,#ff7ab8,#ffd36b) border-box}
.hsc.no{justify-content:center;min-height:52px;background:linear-gradient(#17295f,#0d1738) padding-box,linear-gradient(#4a5a8a,#2a3a6a) border-box;font-weight:700}
.hsc .hci{flex:none;width:64px;height:64px;display:grid;place-items:center}
.hsc .hci img{max-width:64px;max-height:64px;image-rendering:pixelated}
.hsc span{display:grid;gap:3px;min-width:0}
.hsc b{font-size:16px;color:#ffb8d8}
.hsc em{font-style:normal;font-size:11px;color:#9fb1da}
.hpw,.hsc .hpw{display:flex;flex-wrap:wrap;gap:3px 8px;font-size:11px;font-weight:700;color:#ffe46a}

const W=w.getBoundingClientRect(),P=(p.querySelector('.pm')||p).getBoundingClientRect(),cx=P.left-W.left+P.width/2,top=P.top-W.top;
const fx=(html,x,y,fr,op)=>{const d=document.createElement('div');d.className='efx';d.innerHTML=html;d.style.left=x+'px';d.style.top=y+'px';w.appendChild(d);const a=d.animate(fr,Object.assign({duration:900,easing:'ease-out',fill:'forwards'},op));a.onfinish=()=>d.remove()};
let T=0;
if(kind=='joy'){T=rm?300:1100;
 p.animate([{transform:'translateY(0) scale(1,1)'},{transform:'translateY(0) scale(1.08,.9)',offset:.1},{transform:'translateY(-34px) scale(.95,1.07)',offset:.28},{transform:'translateY(0) scale(1.1,.88)',offset:.45},{transform:'translateY(-22px) scale(.97,1.04)',offset:.62},{transform:'translateY(0) scale(1.06,.93)',offset:.8},{transform:'translateY(0) scale(1,1)'}],{duration:T,easing:'ease-in-out'});
 if(!rm)for(let i=0,N=o.heart===0?8:6;i<N;i++){const L=i%2==0,x=cx+(L?-1:1)*(P.width*.35+Math.random()*24)-14,y=top+P.height*.25+Math.random()*30,ic=o.heart===0?EFX.star2:i%3==2?EFX.star:EFX.heart;
  setTimeout(()=>fx(ic,x,y,[{opacity:0,transform:'translateY(0) scale(.6)'},{opacity:1,transform:'translateY(-14px) scale(1)',offset:.2},{opacity:0,transform:`translate(${L?-12:12}px,-70px) scale(1)`}],{duration:1200}),i*140)}}

if(kind=='sad'){T=rm?400:2200;const f='saturate(.45) brightness(.82)';
 p.animate([{transform:'translateY(0) scale(1,1) rotate(0)',filter:'none'},{transform:'translateY(4px) scale(1.04,.9) rotate(-4deg)',filter:f,offset:.2},{transform:'translateY(5px) scale(1.05,.89) rotate(-4deg)',filter:f,offset:.8},{transform:'translateY(0) scale(1,1) rotate(0)',filter:'none'}],{duration:T,easing:'ease-in-out'});
 if(!rm){for(let i=0;i<4;i++)fx(EFX.gloom,P.left-W.left+P.width*(.25+i*.17),top-6,[{opacity:0,transform:'translateY(-10px)'},{opacity:.85,transform:'translateY(0)',offset:.25},{opacity:.85,transform:'translateY(4px)',offset:.75},{opacity:0,transform:'translateY(8px)'}],{duration:T,easing:'linear',delay:i*80});
  setTimeout(()=>fx(EFX.drop,P.left-W.left+P.width*.78,top+P.height*.18,[{opacity:0,transform:'translateY(0)'},{opacity:1,transform:'translateY(4px)',offset:.2},{opacity:1,transform:'translateY(26px)',offset:.85},{opacity:0,transform:'translateY(32px)'}],{duration:1300,easing:'ease-in'}),300);
  setTimeout(()=>fx('<b class="sigh">…</b>',P.left-W.left-8,top+P.height*.3,[{opacity:0,transform:'translate(0,0)'},{opacity:1,transform:'translate(-10px,-6px)',offset:.3},{opacity:0,transform:'translate(-24px,-18px)'}],{duration:1400}),500)}}
return new Promise(r=>setTimeout(()=>{w.classList.remove('emo');if(lk){CB=0;render()}r()},T+(rm?0:300)))}
tick();setInterval(tick,30000);if(!S.type)S.hpk?showHrtPick():showEggPick();else if(!S.name)showName();
</script>
